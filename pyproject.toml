[project]
name = "edelkrone-unreal-connector"
version = "0.1.0"
description = "Drive an edelkrone FocusPLUS PRO focus motor from an Unreal Engine CineCamera, and back"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
  "ruamel.yaml>=0.18",
  "pyserial>=3.5",
  "edelkrone>=0.1.1",
  "bleak>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ek-probe = "tools.ek_probe:main"
ue-probe = "tools.ue_probe:main"
ek-bridge = "bridge.app:main"
ek-ble = "tools.ek_ble:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["eklink*", "ekble*", "unreal*", "bridge*", "tools*"]

[tool.setuptools.package-data]
bridge = ["ui/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
